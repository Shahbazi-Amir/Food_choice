name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Smoke test preview server
        run: |
          npm run serve > /tmp/food-choice-preview.log 2>&1 &
          PID=$!
          trap 'kill $PID' EXIT
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          curl --fail --silent http://127.0.0.1:4173/manifest.webmanifest > /dev/null
          curl --fail --silent http://127.0.0.1:4173/js/app.js > /dev/null
